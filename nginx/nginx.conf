upstream homespace_app {
    server web1:8000;
    server web2:8000;
}


server {
    listen 80;

    server_name 13.60.215.237;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;

    server_name 13.60.215.237;

    ssl_certificate /etc/letsencrypt/live/13.60.215.237/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.60.215.237/privkey.pem;

    location / {
        proxy_pass http://homespace_app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
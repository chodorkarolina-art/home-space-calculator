services:

  db:
    image: postgres:17-alpine

    container_name: homespace_prod_db

    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  web:
    build: .

    container_name: homespace_prod_web

    restart: unless-stopped

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      "

    env_file:
      - .env.prod

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy


  nginx:
    image: nginx:alpine

    container_name: homespace_prod_nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro

    depends_on:
      - web


volumes:
  postgres_prod_data: